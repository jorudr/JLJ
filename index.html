<!doctype html>
<html lang="en" class="bg-white text-black" style="background-color: #ffffff; color: #000000;">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/herb-white.svg?v=3" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="JORU is a trading journal for systematic trade review, performance analysis, equity tracking and strategy development. Available for Windows and macOS.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="https://www.gandr.site/">
  <link rel="alternate" hreflang="en" href="https://www.gandr.site/">
  <link rel="alternate" hreflang="ru" href="https://www.gandr.site/ru/">
  <link rel="alternate" hreflang="x-default" href="https://www.gandr.site/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="JORU">
  <meta property="og:title" content="Trading Journal — JORU">
  <meta property="og:description" content="Review trades, analyze performance, track equity and develop your trading system in one application.">
  <meta property="og:url" content="https://www.gandr.site/">
  <meta property="og:image" content="https://www.gandr.site/screenshots/deep-data.png">
  <meta property="og:image:alt" content="JORU trade analysis interface">
  <meta name="twitter:card" content="summary_large_image">
  <title>Trading Journal — JORU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      overflow: hidden;
      pointer-events: auto;
    }
    #app-loader.loader-fade-out {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .loader-stripe {
      position: relative;
      flex: 1 1 0%;
      width: 100%;
      overflow: hidden;
      background: #ffffff;
    }
    .loader-stripe .bar-black,
    .loader-stripe .bar-white {
      position: absolute;
      top: -0.5px;
      bottom: -0.5px;
      left: 0;
      right: 0;
      width: 100%;
      transform: scaleX(0);
      transform-origin: left center;
      will-change: transform;
    }
    .loader-stripe .bar-black {
      background: #000000;
      z-index: 1;
    }
    .loader-stripe .bar-white {
      background: #ffffff;
      z-index: 2;
    }

    /* Phase 1: Black Fill (runs first across 5 stripes) */
    .loader-stripe:nth-child(1) .bar-black { animation: stripe-fill 0.44s cubic-bezier(0.77, 0, 0.175, 1) 0.05s forwards; }
    .loader-stripe:nth-child(2) .bar-black { animation: stripe-fill 0.44s cubic-bezier(0.77, 0, 0.175, 1) 0.13s forwards; }
    .loader-stripe:nth-child(3) .bar-black { animation: stripe-fill 0.44s cubic-bezier(0.77, 0, 0.175, 1) 0.21s forwards; }
    .loader-stripe:nth-child(4) .bar-black { animation: stripe-fill 0.44s cubic-bezier(0.77, 0, 0.175, 1) 0.29s forwards; }
    .loader-stripe:nth-child(5) .bar-black { animation: stripe-fill 0.44s cubic-bezier(0.77, 0, 0.175, 1) 0.37s forwards; }

    /* Phase 2: White Fill (starts strictly after all black stripes have arrived at 0.81s + pause) */
    .loader-stripe:nth-child(1) .bar-white { animation: stripe-fill 0.44s cubic-bezier(0.77, 0, 0.175, 1) 0.95s forwards; }
    .loader-stripe:nth-child(2) .bar-white { animation: stripe-fill 0.44s cubic-bezier(0.77, 0, 0.175, 1) 1.03s forwards; }
    .loader-stripe:nth-child(3) .bar-white { animation: stripe-fill 0.44s cubic-bezier(0.77, 0, 0.175, 1) 1.11s forwards; }
    .loader-stripe:nth-child(4) .bar-white { animation: stripe-fill 0.44s cubic-bezier(0.77, 0, 0.175, 1) 1.19s forwards; }
    .loader-stripe:nth-child(5) .bar-white { animation: stripe-fill 0.44s cubic-bezier(0.77, 0, 0.175, 1) 1.27s forwards; }

    @keyframes stripe-fill {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    /* Phase 3: Content Fade In */
    #app-loader:not(.loader-fade-out) ~ #app {
      opacity: 0;
    }
    #app {
      opacity: 1;
      transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .loader-stripe .bar-black,
      .loader-stripe .bar-white {
        display: none !important;
      }
      #app-loader {
        display: none !important;
      }
      #app-loader:not(.loader-fade-out) ~ #app {
        opacity: 1 !important;
      }
    }
  </style>
  <script>
    window.__loaderStartTime = performance.now();
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    window.scrollTo(0, 0);
  </script>
</head>

<body class="bg-white text-black" style="background-color: #ffffff; color: #000000;">
  <div id="app-loader" aria-hidden="true">
    <div class="loader-stripe"><div class="bar-black"></div><div class="bar-white"></div></div>
    <div class="loader-stripe"><div class="bar-black"></div><div class="bar-white"></div></div>
    <div class="loader-stripe"><div class="bar-black"></div><div class="bar-white"></div></div>
    <div class="loader-stripe"><div class="bar-black"></div><div class="bar-white"></div></div>
    <div class="loader-stripe"><div class="bar-black"></div><div class="bar-white"></div></div>
  </div>
  <div id="app" class="bg-white text-black"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
