<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Metrics</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff}body,button{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}body{-webkit-font-smoothing:antialiased}main{width:min(100% - 48px,1440px);margin:auto;padding:56px 0 110px}.section-number{font-size:10px;font-weight:900;letter-spacing:.6em;opacity:.45}h1{font-size:24px;letter-spacing:.22em;margin:24px 0;font-weight:900;text-transform:uppercase}.tabs{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid #ffffff1a;padding-bottom:12px;margin-bottom:32px}.tab{display:inline-flex;align-items:center;gap:8px;border:1px solid #ffffff26;background:none;color:#ffffff73;padding:8px 16px;font-size:9px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.tab:hover{color:#fff;border-color:#ffffff66}.tab[aria-selected=true]{background:#fff;color:#000;border-color:#fff}.tab[aria-selected=true]::before{content:'';width:6px;height:6px;background:#000;transform:rotate(45deg)}.count{font-size:8px;padding:2px 6px;background:#ffffff1a;border-radius:999px;opacity:.6}.tab[aria-selected=true] .count{background:#0000001a}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}.metric{display:flex;flex-direction:column;gap:4px;text-align:left;border:0;background:none;color:#fff;padding:0;min-width:0}.label{font-size:8px;font-weight:900;line-height:1.5;letter-spacing:.1em;text-transform:uppercase;opacity:.4}.value{font-size:20px;font-weight:900;line-height:1.4;padding-top:4px}.sub{font-size:8px;line-height:1.5;letter-spacing:.15em;text-transform:uppercase;color:#ffffff99;padding-bottom:4px}.label,.value,.sub{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.metric:hover .label,.metric:focus .label{opacity:.6}button:focus-visible{outline:1px solid #fff;outline-offset:4px}
@media(min-width:1536px){main{padding-top:72px}.tabs{margin-bottom:48px}.tab{padding:10px 20px;font-size:12px}.count{font-size:10px}.grid{gap:32px}.label,.sub{font-size:10px}.value{font-size:24px}h1{font-size:30px}.section-number{font-size:12px}}
@media(min-width:1920px){.tab{font-size:14px;padding:12px 24px}.label,.sub{font-size:12px}.value{font-size:30px}}
@media(max-width:639px){main{width:calc(100% - 24px);padding-top:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.tab{padding:6px 10px;font-size:8px}h1{font-size:20px}}
</style></head><body><main><div class="section-number">III.</div><h1>Metrics</h1><div class="tabs" role="tablist" aria-label="Metric categories"></div><div class="grid" id="metrics" role="tabpanel"></div></main>
<script>
// Full source metric catalog; standalone demo values, no account data.
const metrics=[{"key": "netProfit", "category": "simple", "label": "Net Profit", "sub": "Realized trade PnL", "desc": "Net realized financial result after full trade liquidation.", "formula": "Gross Profit - Gross Loss", "benchmark": "> $0.00 (Profitable Outcome)", "value": "+$240.00", "color": "#34d399"}, {"key": "riskRewardRatio", "category": "simple", "label": "Risk/Reward Ratio", "sub": "Setup R/R ratio", "desc": "Ratio of planned target profit relative to defined stop loss risk.", "formula": "Planned Profit / Stop Loss Risk", "benchmark": ">= 2.00R (High Asymmetry)", "value": "2.40 R", "color": "#34d399"}, {"key": "requiredAdherence", "category": "adherence", "label": "Required Adherence", "sub": "Fulfilled Required Rules", "desc": "Evaluates the percentage of required matrix conditions fulfilled during execution.", "formula": "(Fulfilled / Required) * 100", "benchmark": "100% (Perfect Adherence)", "value": "100%", "color": "#10b981"}, {"key": "additionalAlpha", "category": "adherence", "label": "Additional PnL", "sub": "Additional Conditions effect", "desc": "Difference between the average PnL of trades with additional conditions and trades without them.", "formula": "Average PnL with Additional Conditions − Average PnL without them", "benchmark": "> $0 (Positive Effect)", "value": "+$42.00", "color": "#10b981"}, {"key": "conditionalPnlRatio", "category": "adherence", "label": "Conditional PnL Ratio", "sub": "Profit ratio per setup condition", "desc": "Ratio of profit captured per active condition in the trading setup.", "formula": "Realized PnL / Active Conditions Count", "benchmark": "> $100.00 / condition (High Efficiency)", "value": "1.32", "color": "#6ee7b7"}, {"key": "cognitiveStability", "category": "behavioural", "label": "Cognitive Stability", "sub": "Neural Telemetry", "desc": "Evaluates active emotional markers, deducting stability points for psychological friction tags.", "formula": "100 − (Friction Tags / All Emotion Tags × 100)", "benchmark": ">= 70% (Stable)", "value": "86%", "color": "#10b981"}, {"key": "dominantBias", "category": "behavioural", "label": "Dominant Bias", "sub": "Primary Friction Marker", "desc": "Identifies the primary psychological friction marker present and maps it to its execution risk profile.", "formula": "Most Frequent Friction Tag", "benchmark": "None (Clear Execution)", "value": "DISCIPLINE", "color": "#f59e0b"}, {"key": "emotionalPnlDrag", "category": "behavioural", "label": "Emotional PnL Drag", "sub": "Psychological friction drag", "desc": "Difference between average PnL without friction tags and average PnL with them.", "formula": "Average PnL without friction − Average PnL with friction", "benchmark": "$0.00 (No Measured Drag)", "value": "-$8.00", "color": "#fbbf24"}, {"key": "frictionDensity", "category": "behavioural", "label": "Friction Density", "sub": "Friction Markers Ratio", "desc": "Total count of active negative emotional tags divided by total active tags.", "formula": "(Friction Tags / Total Tags) * 100", "benchmark": "0% (Pristine)", "value": "0.12", "color": "#f59e0b"}, {"key": "netResultVariance", "category": "execution", "label": "Net Result Variance", "sub": "vs Strategy Average PnL", "desc": "Shows how many times the current trade PnL is above or below the strategy average PnL.", "formula": "|Trade PnL| / |Strategy Average PnL|", "benchmark": "Comparison with 1.00x (average PnL)", "value": "+$18.00", "color": "#10b981"}, {"key": "yieldEfficiency", "category": "execution", "label": "Yield Efficiency", "sub": "Balance Before Trade", "desc": "Measures net impact of this trade relative to account balance immediately before entry.", "formula": "(PnL / Balance Before Trade) * 100", "benchmark": "> 0% (Positive Impact)", "value": "2.40%", "color": "#10b981"}, {"key": "profitVelocity", "category": "execution", "label": "Profit Velocity", "sub": "PnL per holding hour", "desc": "PnL earned per hour of position holding time.", "formula": "Trade PnL / Duration Hours", "benchmark": "> $50.00/h (High Momentum)", "value": "$60.00/h", "color": "#34d399"}, {"key": "plannedVsRealizedRisk", "category": "execution", "label": "Planned vs Realized Risk", "sub": "Risk Audit", "desc": "Audits planned stop-loss risk and realized loss against Risk Per Trade budget.", "formula": "Stop Risk = |Entry - Stop| * Size · Realized Loss = max(0, -PnL)", "benchmark": "<= Risk Budget (Compliant)", "value": "0.96", "color": "#10b981"}, {"key": "temporalExposure", "category": "execution", "label": "Temporal Exposure", "sub": "Holding Duration", "desc": "Total duration of trade from entry to exit protocol completion.", "formula": "Exit Timestamp - Entry Timestamp", "benchmark": "<= Avg Duration (Efficient)", "value": "4.00h", "color": "#ffffff"}, {"key": "stopLossDistance", "category": "execution", "label": "Stop Loss Distance", "sub": "Entry to Stop Loss in %", "desc": "Percentage distance between entry price and planned stop loss threshold.", "formula": "(|Entry Price - Stop Loss| / Entry Price) * 100", "benchmark": "<= Avg SL Dist (Tight Stop)", "value": "0.50%", "color": "#ffffff"}, {"key": "takeProfitDistance", "category": "execution", "label": "Take Profit Distance", "sub": "Entry to TP distance in %", "desc": "Percent distance from entry level to target take-profit level.", "formula": "abs(Take Profit - Entry) / Entry * 100", "benchmark": "2.0% - 5.0% (Target Sweetspot)", "value": "1.50%", "color": "#ffffff"}, {"key": "slExecutionDrag", "category": "strategy_execution", "label": "SL Execution Drag", "sub": "Loss-trade slippage only", "desc": "Compares planned stop loss against actual exit price only for losing trades.", "formula": "Long: exit - SL · Short: SL - exit", "benchmark": ">= $0.00 (Zero Drag)", "value": "0.08 R", "color": "#ffffff"}, {"key": "riskBudgetAdherence", "category": "strategy_execution", "label": "Risk Budget Adherence", "sub": "Max Risk vs Budget", "desc": "Compares worst value between planned stop risk and realized loss against Risk Per Trade budget.", "formula": "max(Stop Risk, Realized Loss) / Risk Budget × 100", "benchmark": "<= 100% (Compliant)", "value": "96%", "color": "#10b981"}, {"key": "tpCaptureRatio", "category": "strategy_execution", "label": "TP Capture Ratio", "sub": "Target Reward Captured", "desc": "Measures how much of planned reward toward take profit was realized before exit.", "formula": "(Reward Toward TP / Target Reward) * 100", "benchmark": "100% (Full Capture)", "value": "80%", "color": "#f59e0b"}, {"key": "edgeCaptureQuotient", "category": "strategy_execution", "label": "Planned RR / Baseline RR", "sub": "Planned Trade RR vs Baseline RR", "desc": "Compares the trade\\", "formula": "Planned Trade RR / Baseline Matrix RR", "benchmark": ">= 1.0x (Plan Meets Baseline)", "value": "0.84", "color": "#f43f5e"}, {"key": "unrealizedAlphaLeft", "category": "in_trade", "label": "Unrealized Alpha Left", "sub": "Maximum profit − captured profit in $", "desc": "Shows the dollar profit left uncaptured versus the maximum favorable movement. For a losing trade, captured profit is treated as $0.", "formula": "Maximum Profit in $ − max(Captured PnL, 0)", "benchmark": "< $100.00 (Minimal Leftover)", "value": "20%", "color": "#34d399"}, {"key": "meaningfulLossTime", "category": "in_trade", "label": "Confirmed Loss Time", "sub": "Time in drawdown zone", "desc": "Total duration of candles entirely adverse to entry. Crossing candles are excluded.", "formula": "Sum(Drawdown Candle Durations)", "benchmark": "< 30 min (Quick Bounce)", "value": "18m", "color": "#f43f5e"}, {"key": "meaningfulProfitTime", "category": "in_trade", "label": "Confirmed Profit Time", "sub": "Time in profit zone", "desc": "Total duration of candles entirely favorable to entry. Crossing candles are excluded.", "formula": "Sum(Profit Candle Durations)", "benchmark": "> 45 min (Strong Hold)", "value": "3h 42m", "color": "#34d399"}, {"key": "maxMeaningfulDrawdown", "category": "in_trade", "label": "Max Meaningful Drawdown", "sub": "Peak adverse move (MAE)", "desc": "Maximum adverse price move from entry during the trade.", "formula": "Max Adverse Excursion from Entry", "benchmark": "< 1.5% (Controlled Risk)", "value": "-0.28%", "color": "#f43f5e"}, {"key": "maxFavorableExcursion", "category": "in_trade", "label": "Max Favorable Excursion", "sub": "Peak favorable move (MFE)", "desc": "Maximum favorable price excursion achieved past entry level during trade.", "formula": "Max Favorable Excursion from Entry", "benchmark": "> 3.0% (Strong Expansion)", "value": "1.48%", "color": "#34d399"}, {"key": "profitCaptureRatio", "category": "in_trade", "label": "Profit Capture Ratio", "sub": "Share of MFE captured", "desc": "Share of available favorable price movement captured by the actual exit.", "formula": "(Realized PnL / Max Potential MFE PnL) * 100", "benchmark": "≥ 50% (High Capture)", "value": "81%", "color": "#34d399"}, {"key": "pricePathShape", "category": "in_trade", "label": "Price Path Shape", "sub": "Movement sequence relative to entry", "desc": "Shows whether price crossed the entry adversely and which movement occurred first.", "formula": "Order of favorable and adverse movement relative to entry price", "benchmark": "Clean Impulse", "value": "FAVORABLE FIRST", "color": "#10b981"}, {"key": "firstImpulseDirection", "category": "in_trade", "label": "Initial Movement", "sub": "First classified candle", "desc": "Direction of the first candle entirely on one side of entry. Crossing candles do not establish direction.", "formula": "First Candle Entirely Above or Below Entry", "benchmark": "Favorable (Immediate Profit)", "value": "PROFIT", "color": "#10b981"}, {"key": "entryHeat", "category": "in_trade", "label": "Entry Heat", "sub": "Adverse Delay", "desc": "Time from entry to first impulse start when first impulse was adverse.", "formula": "Time to Adverse Impulse Start", "benchmark": "< 10 min (Minimal Heat)", "value": "0.12%", "color": "#f59e0b"}, {"key": "adverseBeforeProfit", "category": "in_trade", "label": "Adverse Before Profit", "sub": "Drawdown before Profit", "desc": "Whether definite adverse movement appeared before definite profit. If no profit occurred, any drawdown produces a Yes.", "formula": "Adverse Move Occurred Before Profit", "benchmark": "No (Direct Profit)", "value": "YES", "color": "#f43f5e"}, {"key": "hadNews", "category": "in_trade", "label": "News During Trade", "sub": "Macro News Backdrop", "desc": "Manual user mark for whether high-impact news occurred during the trade duration.", "formula": "User Manual News Tag", "benchmark": "No (Technical Market)", "value": "NO", "color": "#ffffff"}];
const tabs=[['all','All'],['adherence','Matrix Adherence'],['behavioural','Behavioural'],['execution','Execution & Risk'],['strategy_execution','Strategy vs Execution'],['in_trade','In-Trade Analysis']];
const navigation=document.querySelector('.tabs'),grid=document.querySelector('.grid');
function element(tag,className,text){const el=document.createElement(tag);el.className=className;el.textContent=text;return el}
function select(id){navigation.querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.id===id)));grid.setAttribute('aria-labelledby','tab-'+id);grid.replaceChildren();metrics.filter(m=>id==='all'||m.category===id).forEach(m=>{const card=element('div','metric','');const value=element('span','value',m.value);value.style.color=m.color;card.append(element('span','label',m.label.replaceAll('_',' ')),value,element('span','sub',m.sub));grid.append(card)})}
tabs.forEach(([id,label])=>{const b=element('button','tab','');b.id='tab-'+id;b.dataset.id=id;b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-controls','metrics');b.append(element('span','',label),element('span','count',String(metrics.filter(m=>id==='all'||m.category===id).length)));b.addEventListener('click',()=>select(id));navigation.append(b)});
navigation.addEventListener('keydown',e=>{const buttons=[...navigation.children],i=buttons.indexOf(document.activeElement);if(i<0)return;let next;if(e.key==='ArrowRight')next=(i+1)%buttons.length;if(e.key==='ArrowLeft')next=(i+buttons.length-1)%buttons.length;if(e.key==='Home')next=0;if(e.key==='End')next=buttons.length-1;if(next!==undefined){e.preventDefault();buttons[next].focus();select(buttons[next].dataset.id)}});
select('all');
</script></body></html>
